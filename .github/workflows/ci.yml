name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CI_MONGO_URI: ${{ secrets.MONGO_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check MongoDB connectivity
        run: |
          node -e '
            const mongoose = require("mongoose");
            const uri = process.env.CI_MONGO_URI;
            if (!uri) { console.error("CI_MONGO_URI is not set"); process.exit(1); }
            console.log("Connecting to MongoDB...");
            mongoose.connect(uri, { serverSelectionTimeoutMS: 5000 })
              .then(() => { console.log("MongoDB connection OK"); mongoose.disconnect(); process.exit(0); })
              .catch(e => { console.error("MongoDB connection FAILED:", e.message); process.exit(1); });
          '
        env:
          CI_MONGO_URI: ${{ secrets.MONGO_URL }}
      - name: Run tests
        run: npm test
      - name: Npm audit
        run: npm audit --audit-level=moderate || true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
